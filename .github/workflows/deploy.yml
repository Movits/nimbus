name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gates do conselho r3 (P0-1): copy banida e link interno quebrado
      # derrubam o deploy. SKIP_REDE evita flutuação de rede no CI; a varredura
      # completa de URLs externas roda localmente antes de cada merge.
      - run: node scripts/vitrine/lint-copy.mjs
      - run: node scripts/vitrine/lint-claims.mjs
      - run: SKIP_REDE=1 node scripts/vitrine/link-check.mjs
      - run: node scripts/vitrine/parity-tokens.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
